stages:
  - verify
  - test
  - gate

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

default:
  image: mirror.gcr.io/library/eclipse-temurin:21.0.8_9-jdk-noble
  interruptible: true
  timeout: 10 minutes
  cache:
    key: gradle-8.14.3-jdk-21
    paths:
      - .gradle/caches/
      - .gradle/wrapper/

compile:
  stage: verify
  script:
    # Starter fault: this path intentionally does not exist.
    - test -f gradlew
    - sh gradlew --no-daemon compileJava

unit-tests:
  stage: test
  script:
    - sh gradlew --no-daemon test
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - build/test-results/test/TEST-*.xml
      - build/allure-results/
    reports:
      junit: build/test-results/test/TEST-*.xml

quality-gate:
  stage: gate
  needs:
    - compile
    - unit-tests
  allow_failure: false
  script:
    - sh gradlew --no-daemon check
